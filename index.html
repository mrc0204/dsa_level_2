<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Vault — Question Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/main.css">
</head>

<body>

    <div class="app">
        <header class="top">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#C1622E" stroke-width="1.8">
                        <path d="M4 6h16M4 12h10M4 18h16" stroke-linecap="round" />
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>DSA Vault</h1>
                    <p>Your personal question tracker</p>
                </div>
            </div>
            <div class="top-right">
                <div class="top-stats">
                    <div class="top-stat">
                        <div class="num" id="statTotalQuestions">0</div>
                        <div class="label">questions</div>
                    </div>
                    <div class="top-stat">
                        <div class="num" id="statTotalEncounters">0</div>
                        <div class="label">encounters</div>
                    </div>
                </div>
                <button class="icon-btn" id="themeToggleBtn" aria-label="Toggle theme">
                    <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="toolbar">
            <div class="search-field">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7" />
                    <path d="M21 21l-4.3-4.3" />
                </svg>
                <input type="text" id="searchInput" placeholder="Search questions…">
            </div>
            <select class="filter-select" id="categoryFilter">
                <option value="">All categories</option>
            </select>
            <select class="filter-select" id="sortSelect">
                <option value="newest">Newest</option>
                <option value="most">Most encountered</option>
                <option value="least">Least encountered</option>
                <option value="alpha">Alphabetical</option>
            </select>
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Modal Scrim Overlay -->
    <div class="modal-scrim" id="modalScrim"></div>

    <!-- Admin Login Modal -->
    <div class="modal" id="adminLoginModal">
        <div class="modal-header">
            <h3>Admin Login</h3>
            <button class="icon-btn" id="closeAdminLoginBtn" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6L6 18M6 6l12 12" />
                </svg>
            </button>
        </div>
        <form id="adminLoginForm" class="modal-body">
            <div class="field-stack">
                <label class="field-label" for="adminPasswordInput">Admin Password</label>
                <input type="password" class="text-input" id="adminPasswordInput" placeholder="Enter password…" required>
                <div class="error-text" id="adminLoginError"></div>
                <p class="step-hint">Default password is <code>admin123</code> (configurable in .env)</p>
                <div class="modal-footer">
                    <button type="submit" class="primary-btn">Login as Admin</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Admin Approval Portal Modal -->
    <div class="modal modal-lg" id="adminPortalModal">
        <div class="modal-header">
            <h3>Admin Portal — Pending Requests</h3>
            <button class="icon-btn" id="closeAdminPortalBtn" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6L6 18M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <p class="modal-intro">Review question requests submitted by normal users. Approved questions get published directly to the vault.</p>
            <div class="pending-requests-list" id="pendingRequestsList"></div>
        </div>
    </div>

    <!-- User Question Request Modal -->
    <div class="modal" id="userRequestModal">
        <div class="modal-header">
            <h3>Request New Question</h3>
            <button class="icon-btn" id="closeUserRequestBtn" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6L6 18M6 6l12 12" />
                </svg>
            </button>
        </div>
        <form id="userRequestForm" class="modal-body">
            <div class="field-stack">
                <div class="autocomplete-wrapper">
                    <label class="field-label" for="reqTitleInput">Question Title</label>
                    <input type="text" class="text-input" id="reqTitleInput" placeholder="e.g. 3Sum" required autocomplete="off">
                    <div class="suggestions-dropdown" id="reqTitleSuggestions"></div>
                </div>
                <div class="existing-match-note" id="reqExistingInfoNote"></div>
                <div>
                    <label class="field-label" for="reqCategorySelect">Category</label>
                    <select class="select-input" id="reqCategorySelect"></select>
                </div>
                <div>
                    <label class="field-label" for="reqDescInput">Description / Problem Summary</label>
                    <textarea class="text-area" id="reqDescInput" placeholder="Brief summary of problem requirements…"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="primary-btn">Submit Request</button>
                </div>
            </div>
        </form>
    </div>

    <script type="module" src="/src/js/main.js"></script>

</body>

</html>
